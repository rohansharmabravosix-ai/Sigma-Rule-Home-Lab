title: Office Application Spawning a Shell
id: ea3584c3-da92-5d7e-a6c3-7b164c104477
status: test
description: Detects common Office applications spawning a command shell or PowerShell. Validate field mapping and tune approved workflows.
author: Rohan Sharma
date: 2026-10-20
logsource:
    product: windows
    category: process_creation
detection:
    selection_parent:
        ParentImage|endswith:
            - '\WINWORD.EXE'
            - '\EXCEL.EXE'
            - '\POWERPNT.EXE'
    selection_child:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\cmd.exe'
    condition: selection_parent and selection_child
falsepositives:
    - Legitimate administrative activity and approved software behavior
level: high
tags:
    - attack.execution
    - attack.t1059
