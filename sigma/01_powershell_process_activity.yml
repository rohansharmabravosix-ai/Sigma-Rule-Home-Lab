title: PowerShell Process Activity
id: 9061ef46-c7a2-5dc4-884d-c5e225d9c559
status: test
description: Detects PowerShell process creation for review.
author: Rohan Sharma
date: 2026-10-20
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    condition: selection
falsepositives:
    - Legitimate administrative activity and approved software behavior
level: medium
tags:
    - attack.execution
    - attack.t1059.001
