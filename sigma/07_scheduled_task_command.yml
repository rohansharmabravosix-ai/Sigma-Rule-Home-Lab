title: Scheduled Task Created or Changed
id: b573239e-2977-594e-b304-5f300dd7b090
status: test
description: Detects schtasks.exe create/change commands. Review task name and action.
author: Rohan Sharma
date: 2026-10-20
logsource:
    product: windows
    category: process_creation
detection:
    selection_image:
        Image|endswith: '\schtasks.exe'
    selection_args:
        CommandLine|contains:
            - ' /create'
            - ' /change'
    condition: selection_image and selection_args
falsepositives:
    - Legitimate administrative activity and approved software behavior
level: medium
tags:
    - attack.persistence
    - attack.t1053.005
